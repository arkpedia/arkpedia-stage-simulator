name: Stage continuation checks
on:
  push:
    branches: [dev/windows-stage-continuation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage-continuation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install source clock parser dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            tools/arkpedia/stages/requirements.txt
            tools/arkpedia/windows-client-requirements.txt
      - run: python -m pip install -r tools/arkpedia/stages/requirements.txt
      - run: python -m pip install -r tools/arkpedia/windows-client-requirements.txt
      - name: Fetch only frozen official Windows native evidence (never execute the client)
        run: node tools/arkpedia/windows-client-source.mjs --fetch
      - name: Reproduce static Windows metadata and compiled default ability-event handler
        run: python tools/arkpedia/extract-windows-ability-events.py --check
      - run: node --test test/arkpedia-enemy-family-source-plan.test.js
      - name: Fetch exact frozen family dependencies and named template source
        run: node tools/arkpedia/fetch-enemy-family-source.mjs --fetch ch16-miner ch16-story-guardian ch16-fear-projectile ch16-artillery ch16-crossbow ch16-patrol ch17-brute ch17-flyer ch17-bag ch17-channel-carrier ch17-war-caster ch17-firewall-boss
      - name: Bind original CN component references to exact shared MonoScripts
        run: python tools/arkpedia/extract-native-script-bindings.py --fetch --check
      - name: Reproduce static Windows cast, animator and bounded-wait evidence
        run: python tools/arkpedia/extract-windows-cast-lifecycle.py --check
      - name: Reproduce default miner talent assignment and missing-duration evidence
        run: python tools/arkpedia/extract-windows-miner-talents.py --check
      - name: Reproduce fear selector binding and conditional abnormal-filter evidence
        run: python tools/arkpedia/extract-windows-fear-selector.py --check
      - name: Independently reproduce complete native graphs and indexed components
        run: |
          python tools/arkpedia/extract-ch16-artillery.py --check
          python tools/arkpedia/extract-ch16-crossbow.py --check
          python tools/arkpedia/extract-ch16-miner.py --check
          python tools/arkpedia/extract-ch16-patrol.py --check
          python tools/arkpedia/extract-enemy-family-source.py --family ch16-story-guardian --prefab enemy_3011_dyegrd --check
          python tools/arkpedia/extract-enemy-family-source.py --family ch16-fear-projectile --prefab enemy_10128_fearpj --check
          python tools/arkpedia/extract-enemy-family-source.py --family ch17-brute --prefab enemy_10207_mubrut --prefab enemy_10207_mubrut_2 --check
          python tools/arkpedia/extract-enemy-family-source.py --family ch17-flyer --prefab enemy_10205_mufly --prefab enemy_10205_mufly_2 --check
          python tools/arkpedia/extract-enemy-family-source.py --family ch17-bag --prefab enemy_10209_mubag --prefab enemy_10209_mubag_2 --check
          python tools/arkpedia/extract-enemy-family-source.py --family ch17-channel-carrier --prefab enemy_10203_mumag --prefab enemy_10203_mumag_2 --prefab enemy_10208_mucow --prefab enemy_10208_mucow_2 --check
          python tools/arkpedia/extract-enemy-family-source.py --family ch17-war-caster --prefab enemy_10210_muwiz --prefab enemy_10210_muwiz_2 --check
          python tools/arkpedia/extract-enemy-family-source.py --family ch17-firewall-boss --prefab enemy_1590_muama --prefab enemy_1591_mutwin --prefab enemy_1591_mutwin_2 --prefab enemy_1593_musnake --check
          python tools/arkpedia/extract-firewall-environment-source.py --check
          python tools/arkpedia/extract-enemy-native-abilities.py --prefab enemy_3011_dyegrd --output data/candidates/arkpedia-ch16-story-guardian-native.json --check
          python tools/arkpedia/extract-enemy-native-abilities.py --prefab enemy_10128_fearpj --output data/candidates/arkpedia-ch16-fear-projectile-native.json --check
          python tools/arkpedia/extract-enemy-native-abilities.py --prefab enemy_10207_mubrut --prefab enemy_10207_mubrut_2 --output data/candidates/arkpedia-ch17-brute-native.json --check
          python tools/arkpedia/extract-enemy-native-abilities.py --prefab enemy_10205_mufly --prefab enemy_10205_mufly_2 --output data/candidates/arkpedia-ch17-flyer-native.json --check
          python tools/arkpedia/extract-enemy-native-abilities.py --prefab enemy_10209_mubag --prefab enemy_10209_mubag_2 --output data/candidates/arkpedia-ch17-bag-native.json --check
          python tools/arkpedia/extract-enemy-native-abilities.py --prefab enemy_10203_mumag --prefab enemy_10203_mumag_2 --prefab enemy_10208_mucow --prefab enemy_10208_mucow_2 --output data/candidates/arkpedia-ch17-channel-carrier-native.json --check
          python tools/arkpedia/extract-enemy-native-abilities.py --prefab enemy_10210_muwiz --prefab enemy_10210_muwiz_2 --output data/candidates/arkpedia-ch17-war-caster-native.json --check
          python tools/arkpedia/extract-enemy-native-abilities.py --prefab enemy_1590_muama --prefab enemy_1591_mutwin --prefab enemy_1591_mutwin_2 --prefab enemy_1593_musnake --output data/candidates/arkpedia-ch17-firewall-boss-native.json --check
      - name: Reproduce prefab-bound clocks and corroborate serialized buff event aliases
        run: |
          node tools/arkpedia/fortbreaker-clock-contract.mjs --check
          node tools/arkpedia/shielded-enemy-clock-contract.mjs --check
          node tools/arkpedia/artillery-clock-contract.mjs --check
          node tools/arkpedia/crossbow-clock-contract.mjs --check
          node tools/arkpedia/patrol-clock-contract.mjs --check
          node tools/arkpedia/fear-affliction-contract.mjs --check
          node tools/arkpedia/miner-clock-contract.mjs --check
          node tools/arkpedia/miner-listener-contract.mjs --check
          python tools/arkpedia/extract-enemy-family-clocks.py --family ch16-miner --bundle refs/arts/enm_art_23.ab --check
          python tools/arkpedia/extract-enemy-family-clocks.py --family ch16-patrol --bundle refs/arts/enm_art_6.ab --check
          python tools/arkpedia/extract-enemy-family-clocks.py --family ch16-artillery --bundle refs/arts/enm_art_23.ab --check
          python tools/arkpedia/extract-enemy-family-clocks.py --family ch16-crossbow --bundle refs/arts/enm_art_23.ab --check
          python tools/arkpedia/extract-enemy-family-clocks.py --family ch16-story-guardian --bundle refs/arts/enm_art_23.ab --check
          python tools/arkpedia/extract-enemy-family-clocks.py --family ch16-fear-projectile --bundle refs/arts/enm_art_23.ab --check
          python tools/arkpedia/extract-enemy-family-clocks.py --family ch17-brute --bundle refs/arts/enm_art_26.ab --check
          python tools/arkpedia/extract-enemy-family-clocks.py --family ch17-infantry-bow --bundle refs/arts/enm_art_26.ab --check
          python tools/arkpedia/extract-enemy-family-clocks.py --family ch17-flyer --bundle refs/arts/enm_art_26.ab --check
          python tools/arkpedia/extract-enemy-family-clocks.py --family ch17-bag --bundle refs/arts/enm_art_26.ab --check
          python tools/arkpedia/extract-enemy-family-clocks.py --family ch17-channel-carrier --bundle refs/arts/enm_art_26.ab --check
          python tools/arkpedia/extract-enemy-family-clocks.py --family ch17-war-caster --bundle refs/arts/enm_art_26.ab --check
          python tools/arkpedia/extract-enemy-family-clocks.py --family ch17-firewall-boss --bundle refs/arts/enm_art_26.ab --check
          python tools/arkpedia/recover-buff-event-aliases.py --check
          python tools/arkpedia/recover-buff-event-aliases.py --war-caster --check
          python tools/arkpedia/recover-buff-event-aliases.py --firewall-boss --check
          python tools/arkpedia/recover-buff-event-aliases.py --blockee --check
          node tools/arkpedia/snake-counter-contract.mjs --check
          node tools/arkpedia/snake-terminal-contract.mjs --check
          node tools/arkpedia/snake-timeout-contract.mjs --check
          node tools/arkpedia/snake-health-contract.mjs --check
          node tools/arkpedia/snake-line-contract.mjs --check
          node tools/arkpedia/snake-firewall-contract.mjs --check
          node tools/arkpedia/muama-combat-contract.mjs --check
          node tools/arkpedia/muama-durability-contract.mjs --check
          node tools/arkpedia/muama-line-contract.mjs --check
          node tools/arkpedia/muama-blink-contract.mjs --check
          node tools/arkpedia/mutwin-lifecycle-contract.mjs --check
          node tools/arkpedia/mutwin-stage-record-contract.mjs --check
          node tools/arkpedia/boss-branch-contract.mjs --check
          node tools/arkpedia/ch17-attack-clock-contract.mjs --check
          node tools/arkpedia/bag-feeding-contract.mjs --check
          node tools/arkpedia/war-caster-leave-contract.mjs --check
          node tools/arkpedia/leak-source-terminal-contract.mjs --check
          node tools/arkpedia/stage17-16-schedule-contract.mjs --check
          node tools/arkpedia/stage17-14-mechanics-contract.mjs --check
          node tools/arkpedia/predefined-module-source.mjs --fetch --check
          node tools/arkpedia/predefined-tutorial-source.mjs --fetch --check
          python tools/arkpedia/extract-predefined-modules.py --check
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SP_E2E: '0'
      SP_REAL_E2E: '0'
      RENDER_E2E: '0'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/arkpedia/test-assets.mjs
      - run: npm run test:arkpedia-ch16
  browser:
    strategy:
      fail-fast: false
      matrix:
        stage: ['16-4', '16-5', '16-14', '16-15']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_E2E: '1'
      CHROME_PATH: /usr/bin/google-chrome
      CH16_QA_STAGE: ${{ matrix.stage }}
      CH16_QA_OUT: logs/stage-${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/arkpedia/test-assets.mjs
      - run: node --test test/arkpedia-ch16-ui.browser.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-${{ matrix.stage }}-browser
          path: logs/stage-${{ matrix.stage }}/
  chapter17-browser:
    strategy:
      fail-fast: false
      matrix:
        stage: ['17-5', '17-6', '17-8', '17-9', '17-10', '17-11', '17-12', '17-13', '17-15', '17-17']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_E2E: '1'
      CHROME_PATH: /usr/bin/google-chrome
      CH17_QA_STAGE: ${{ matrix.stage }}
      CH17_QA_OUT: logs/stage-${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/arkpedia/test-assets.mjs
      - run: node --test test/arkpedia-ch17-ui.browser.test.js
      - name: Verify internal preset, wave, tutorial and command UI
        if: matrix.stage == '17-12'
        # Each file starts software WebGL browsers. Serial execution avoids
        # starving requestAnimationFrame and the app's capped simulation delta.
        run: node --test --test-concurrency=1 test/arkpedia-stage-predefines.browser.test.js test/arkpedia-stage-tutorial.browser.test.js test/arkpedia-operator-controls.browser.test.js test/arkpedia-stage-17-14-workspace.browser.test.js
      - uses: actions/upload-artifact@v4
        if: always() && matrix.stage == '17-12'
        with:
          name: internal-17-16-workspace
          path: |
            .cache/stage-tutorial-*.png
            .cache/operator-controls-*.png
            .cache/closur-controls-*.png
            .cache/fixed-stage-preparation-*.png
            .cache/stage17-14-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-${{ matrix.stage }}-browser
          path: logs/stage-${{ matrix.stage }}/
