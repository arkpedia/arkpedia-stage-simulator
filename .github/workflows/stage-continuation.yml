name: Stage continuation checks
on:
  push:
    branches: [dev/windows-stage-continuation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage-continuation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SP_E2E: '0'
      SP_REAL_E2E: '0'
      RENDER_E2E: '0'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/arkpedia/test-assets.mjs
      - run: npm run test:arkpedia-ch16
  browser:
    strategy:
      fail-fast: false
      matrix:
        stage: ['16-14', '16-15']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_E2E: '1'
      CHROME_PATH: /usr/bin/google-chrome
      CH16_QA_STAGE: ${{ matrix.stage }}
      CH16_QA_OUT: logs/stage-${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tools/arkpedia/test-assets.mjs
      - run: node --test test/arkpedia-ch16-ui.browser.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-${{ matrix.stage }}-browser
          path: logs/stage-${{ matrix.stage }}/
