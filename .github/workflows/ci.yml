# GitHub-hosted runners only. Do not add self-hosted/NAS labels here: the owner runs these checks on
# GitHub-owned Ubuntu and Windows images, and test/arkpedia-ci-runners.test.js fails the suite if one appears.
name: CI
run-name: "${{ inputs.scope == 'atomic-json' && 'Atomic JSON verification' || inputs.scope == 'enemy-clocks' && 'Enemy clock source verification' || 'Full simulator verification' }} (${{ github.ref_name }})"

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Full suite, native atomic replacement locks, or original enemy timing sources
        type: choice
        options: [full, atomic-json, enemy-clocks]
        default: full

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.scope || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: ${{ inputs.scope != 'enemy-clocks' }}
    name: ${{ inputs.scope == 'atomic-json' && 'atomic JSON' || 'test' }} (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Full source suites now exceed 45 minutes on multiple matrix entries.
    # Keep every test on Linux/Windows and both Node versions; allow each
    # complete run a bounded 90 minutes rather than stopping passing progress.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22 and 24 = the maintained LTS lines (24 is what `winget install OpenJS.NodeJS.LTS` installs today)
        node: [22, 24]
    env:
      # Browser/E2E suites gate themselves on these (and on a local Chrome + downloaded game assets, which CI never
      # has): keep them off explicitly. Suites that need .cache/gamedata, public/assets or data/local-assets.json skip.
      SP_E2E: '0'
      SP_REAL_E2E: '0'
      RENDER_E2E: '0'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Setup check (no downloads)
        run: node tools/setup.mjs --check --no-local

      - name: Fetch and verify pinned original skeletons for source-identity tests
        if: ${{ inputs.scope != 'atomic-json' }}
        run: node tools/arkpedia/test-assets.mjs

      - name: Unit & integration tests
        if: ${{ inputs.scope != 'atomic-json' }}
        run: node --test

      - name: Atomic replacement tests including real Windows sharing locks
        if: ${{ inputs.scope == 'atomic-json' }}
        run: node --test test/arkpedia-write-json.test.js

      - name: Server smoke test (boot, /healthz, index.html, doctor)
        if: ${{ inputs.scope != 'atomic-json' }}
        shell: bash
        run: |
          node server/index.js > server.log 2>&1 &
          pid=$!
          ok=
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then ok=1; break; fi
            sleep 1
          done
          echo
          [ -n "$ok" ] || { cat server.log; exit 1; }
          # Save the page first: piping curl into `grep -q` let grep exit on the first match, curl then failed with a
          # write error (23) and pipefail turned that into a flaky red step.
          curl -fsS -o index.out http://127.0.0.1:3000/
          grep -qi '<html' index.out
          curl -fsS -o /dev/null http://127.0.0.1:3000/vendor/pixi.min.js
          node tools/doctor.mjs || true
          kill $pid || true

  enemy-clocks:
    if: ${{ inputs.scope == 'enemy-clocks' }}
    name: original enemy clocks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      ARKPEDIA_SOURCE_NODE: node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/arkpedia/stages/requirements.txt
      - name: Install the pinned native source reader
        run: python -m pip install -r tools/arkpedia/stages/requirements.txt
      - name: Fetch and verify the frozen original manifest and all enemy prefab bundles
        run: node tools/arkpedia/cn-enemy-native-source.mjs --fetch
      - name: Check source membership, precision and per-prefab flag distinctions
        run: node --test test/arkpedia-enemy-clock-source.test.js test/arkpedia-closur-enemy-compatibility.test.js test/arkpedia-upstream-enemies.test.js
      - name: Verify the frozen Global table and current regular-enemy compatibility boundary
        run: node tools/arkpedia/closur-enemy-compatibility.mjs --fetch --check
      - name: Verify the held primary-source upstream enemy review
        run: node tools/arkpedia/review-upstream-enemies.mjs --fetch --check
      - name: Independently reproduce native hierarchy and timing records; reject altered claims and corrupt inputs
        run: python tools/arkpedia/audit-enemy-clocks.py
      - name: Keep reviewed source receipts byte-identical
        run: git diff --exit-code -- data/arkpedia-cn-enemy-native-source.json data/arkpedia-enemy-clock-source.json data/arkpedia-closur-enemy-compatibility.json data/arkpedia-upstream-enemy-review.json
